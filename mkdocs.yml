site_name: X-Wiki
site_description: 从本地语音证据持续编译而成的个人知识 Wiki
site_url: https://1998x-stack.github.io/X-Wiki/
repo_url: https://github.com/1998x-stack/X-Wiki
repo_name: 1998x-stack/X-Wiki
docs_dir: sites/.site-docs
site_dir: sites/site
copyright: 本地优先 · 原始语音证据不公开
hooks:
  - scripts/mkdocs_nav.py
theme:
  name: material
  language: zh
  custom_dir: sites/overrides
  favicon: sites/assets/images/x-wiki-og.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
plugins:
  - search
extra_css:
  - sites/assets/stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
