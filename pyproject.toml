[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xwiki-knowledge"
version = "0.1.0"
description = "Local-first, evidence-linked knowledge contracts for X-Wiki"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xwiki-state = "xwiki.infrastructure.sqlite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xwiki*"]

[tool.setuptools.package-data]
"xwiki.infrastructure.sqlite.migrations" = ["*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["sites/.site-docs", "sites/site", "build"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["scripts/tests", "tests/unit", "tests/contract", "tests/integration"]
