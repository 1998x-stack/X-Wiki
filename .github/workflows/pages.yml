name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "index.md"
      - "wiki/**"
      - "mkdocs.yml"
      - "scripts/prepare_site.py"
      - "scripts/wiki_links.py"
      - "scripts/wiki_lint.py"
      - "scripts/release_gate.py"
      - "scripts/mkdocs_nav.py"
      - "scripts/verify_deployment.py"
      - "scripts/evaluate_wiki.py"
      - "evaluation/golden/**"
      - "sites/assets/**"
      - "sites/content/**"
      - "tests/e2e/**"
      - "sites/overrides/**"
      - "sites/requirements-site.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2 ruff==0.13.2
      - run: ruff check .
      - run: pytest
      - run: python scripts/evaluate_wiki.py
      - run: python scripts/wiki_lint.py --strict
  browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sites/requirements-site.txt
      - run: python scripts/prepare_site.py --strict
      - run: python scripts/release_gate.py > sites/.site-docs/release-manifest.json
      - run: mkdocs build --strict
      - run: test -s sites/site/demo/index.html && test -s sites/site/demo/demo.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/playwright.config.cjs
  build:
    needs: [quality, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r sites/requirements-site.txt
      - run: python scripts/wiki_lint.py --strict
      - run: python scripts/prepare_site.py --strict
      - run: python scripts/release_gate.py > sites/.site-docs/release-manifest.json
      - run: mkdocs build --strict
      - run: test -s sites/site/release-manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify live Pages content matches deployed commit
        env:
          XWIKI_DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python scripts/verify_deployment.py --repo . \
            --site-url "$XWIKI_DEPLOYED_URL" \
            --max-wait 180 --receipt deployment-receipt.json
      - name: Store verified deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: deployment-receipt-${{ github.sha }}
          path: deployment-receipt.json
          retention-days: 90
          if-no-files-found: error
