name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "index.md"
      - "wiki/**"
      - "scripts/export_github_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export wiki pages
        run: python scripts/export_github_wiki.py "$RUNNER_TEMP/wiki"
      - name: Push wiki repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/wiki"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sync from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git push --force origin HEAD:master
