name: macOS Core Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2 jsonschema==4.25.1
      - run: pip install -e .
      - name: Test staged compilation and local release recovery
        run: |
          pytest -q scripts/tests/test_staged_compiler.py \
            scripts/tests/test_compile_transaction.py \
            scripts/tests/test_release_gate.py \
            scripts/tests/test_verify_deployment.py \
            scripts/tests/test_mkdocs_nav.py \
            tests/unit/domain/test_models.py \
            tests/contract/test_json_schemas.py \
            tests/integration/sqlite/test_migrations.py \
            tests/integration/sqlite/test_legacy.py \
            tests/integration/sqlite/test_repositories.py \
            tests/integration/source/test_source_import.py
