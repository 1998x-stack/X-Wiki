name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2 ruff==0.13.2 jsonschema==4.25.1
      - run: pip install -e .
      - run: pip wheel --no-deps . --wheel-dir /tmp/xwiki-wheel
      - name: Verify migration SQL files are bundled into the distributable wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("/tmp/xwiki-wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              scripts = sorted(
                  name for name in archive.namelist()
                  if name.startswith("xwiki/infrastructure/sqlite/migrations/")
                  and name.endswith(".sql")
              )
          assert len(scripts) == 4, scripts
          PY
      - run: python -m xwiki.infrastructure.sqlite.cli --help
      - run: ruff check .
      - run: pytest
      - run: python scripts/evaluate_wiki.py
      - run: python scripts/wiki_lint.py --strict
      - run: pip install -r sites/requirements-site.txt
      - run: python scripts/prepare_site.py --strict
      - run: python scripts/release_gate.py > sites/.site-docs/release-manifest.json
      - run: mkdocs build --strict
      - run: test -s sites/site/release-manifest.json
      - run: test -s sites/site/demo/index.html && test -s sites/site/demo/demo.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/e2e/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ux-001-browser-failures
          path: test-results/
          if-no-files-found: ignore
